# The one build. Called by release.yml (a v* tag) and nightly.yml (the clock).
# Publishes the hub and the CLI, builds the installer, and attaches everything
# to a GitHub release under the given tag — created if it does not exist yet.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp, e.g. 0.2.0 or 0.3.0-nightly.20260901"
        required: true
        type: string
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release (nightly)"
        required: true
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish, package, checksum
        shell: pwsh
        run: ./tools/publish.ps1 -Version '${{ inputs.version }}'

      - name: Smoke — the CLI runs and knows its version
        shell: pwsh
        run: |
          $v = (& dist/cli/forge.exe --version | Out-String).Trim()
          if ($v -ne '${{ inputs.version }}') { throw "forge --version printed '$v', expected '${{ inputs.version }}'" }
          # A windowed exe returns to the shell at once; wait for it, then read what it wrote.
          Start-Process -FilePath dist/hub/AutomationForgeHub.exe -ArgumentList '--version' -Wait -NoNewWindow
          $h = (Get-Content hub-version.txt -Raw).Trim()
          if ($h -ne '${{ inputs.version }}') { throw "hub --version wrote '$h', expected '${{ inputs.version }}'" }
          Get-Content dist/SHA256SUMS.txt

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.prerelease && format('Nightly {0}', inputs.version) || format('Automation Forge {0}', inputs.version) }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AutomationForge-Setup.exe
            dist/AutomationForge-Hub-win-x64.zip
            dist/forge-win-x64.zip
            dist/SHA256SUMS.txt

      # The release holds these files for good, so a run artifact is kept only when it failed.
      # Keeping one of every build counted ~150 MB each, for 90 days, against the organisation's
      # 0.5 GB of Actions storage - nightlies included, long after their releases were pruned.
      - name: Keep an unpublished build
        if: ${{ !cancelled() && steps.release.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: automation-forge-${{ inputs.version }}
          path: |
            dist/AutomationForge-Setup.exe
            dist/AutomationForge-Hub-win-x64.zip
            dist/forge-win-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 7
